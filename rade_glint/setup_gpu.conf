[program:rade-glint-setup]
command=/bin/bash /workspace/experiments/rade_glint_20261018/setup_gpu.sh
directory=/workspace/experiments/rade_glint_20261018
environment=PROC_NAME="%(program_name)s",PYTHONUNBUFFERED="1"
